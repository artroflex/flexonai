<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>body{font:14px/1.6 sans-serif;width:340px;padding:18px;color:#172554}h1{font-size:21px}label{display:block;margin-top:14px}input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px}input[type=checkbox]{width:auto}button{margin-top:16px;border:0;border-radius:9px;background:#2563eb;color:white;padding:12px 16px;cursor:pointer}#status{white-space:pre-wrap;font-size:12px}small{color:#64748b}</style></head><body><h1>artroBLOG 연결</h1><small>PC 크롬의 네이버 로그인 상태를 사용합니다.</small><label>플랫폼 주소<input id="origin" value="https://artroblog.vercel.app" readonly></label><label>연결 코드<input id="token" type="password" autocomplete="off"></label><label>내 블로그 ID<input id="blogId" value="srluxury17"></label><label><input id="enabled" type="checkbox"> 대기 작업 자동 처리</label><button id="save">저장하고 연결 확인</button><button id="poll">지금 확인</button><p id="status" role="status"></p><small>자동 발행은 플랫폼에서 임시저장 검증 후 켤 수 있습니다. 편집기 확인에 실패하면 발행하지 않고 멈춥니다.</small><script src="popup.js"></script></body></html>
